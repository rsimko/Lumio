<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="./app-icon.svg" />
    <title>Lumio</title>
    <script>
      // Resolve the theme before first paint so the window never flashes white
      // when the user prefers the dark appearance.
      try {
        const stored = localStorage.getItem('lumio.theme');
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const dark = stored === 'dark' || ((!stored || stored === 'system') && systemDark);
        if (dark) document.documentElement.classList.add('dark');
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
